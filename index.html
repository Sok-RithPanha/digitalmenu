  <!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link href="https://fonts.googleapis.com/css2?family=Yuji+Boku&display=swap" rel="stylesheet">
<title>OSAKA Cafe - Digital Menu</title>

<style>
* {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
}

html {
  background: #f4f1ea;
}

body {
  font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
  background: transparent;
  padding: 20px;
  color: #3b3b3b;
}

body > video {
  position: fixed;
  inset: 0;
  z-index: 0;
  width: 100%;
  height: 100%;
  object-fit: cover;
  filter: brightness(0.65);
  pointer-events: none;
}

/* CONTAINER */
.container {
  position: relative;
  z-index: 1;
  max-width: 1000px;
  margin: auto;
}

h1 {
    font-family: 'Yuji Boku', serif;
    text-align: center;
    margin-bottom: 30px;
    color: #8ba888;
    font-weight: bold;
    border-bottom: 3px solid #8ba888;
    padding-bottom: 10px;
    display: inline-block;
  }
.header-wrapper {
    text-align: center;
}

/* MENU GRID */
.menu-grid {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 20px;
}

/* MENU ITEM */
.menu-item {
  background: transparent;
  border-radius: 12px;
  padding: 15px;
  text-align: center;
  box-shadow: 0 4px 15px rgba(0,0,0,0.05);
  border-top: 6px solid #8ba888; /* Matcha green accent */  
}

.menu-item img {
  width: 100%;
  height: 180px;
  object-fit: cover;
  border-radius: 10px;
}

.menu-item h3 {
  margin: 15px 0 5px;
  color: #8ba888;
}

.menu-item p {
  font-size: 1.1rem;
  margin-bottom: 15px;
  color: #8ba888;
}

.menu-item button {
  width: 100%;
  padding: 12px;
  background: #8ba888; /* Matcha green */
  border: none;
  color: white;
  font-weight: bold;
  border-radius: 8px;
  cursor: pointer;
  transition: background 0.2s ease;
}

.menu-item button:hover {
  background: #738f70;
}

/* CART */
#cart {
  background: white;
  margin-top: 60px;
  padding: 25px;
  border-radius: 12px;
  box-shadow: 0 4px 15px rgba(0,0,0,0.05);
  border-top: 6px solid #8ba888;
}

#cart h2 {
    color: #8ba888;
    border-bottom: 1px dashed #e0e0e0;
    padding-bottom: 15px;
    margin-top: 0;
}

.cart-item {
  display: flex;
  justify-content: space-between;
  align-items: center;
  margin: 15px 0;
  padding-bottom: 15px;
  border-bottom: 1px dashed #e0e0e0;
}

.qty button {
  width: 32px;
  height: 32px;
  border: none;
  background: #f4f1ea;
  border-radius: 6px;
  cursor: pointer;
  color: #3b3b3b;
  font-weight: bold;
}

.qty span {
    margin: 0 10px;
    font-weight: bold;
}

.remove {
  background: #d48a8a !important; /* Muted red */
  color: white !important;
  border: none;
  padding: 5px 8px;
  border-radius: 6px;
  margin-left: 10px;
}

#cart-total {
  font-weight: bold;
  font-size: 1.2em;
  margin-top: 20px;
  text-align: right;
  color: #3b3b3b;
}

#send-order {
  width: 100%;
  padding: 15px;
  margin-top: 20px;
  background: #8ba888;
  color: white;
  border: none;
  border-radius: 8px;
  cursor: pointer;
  font-size: 1.1em;
  font-weight: bold;
  transition: background 0.2s ease;
}
#send-order:hover {
    background: #738f70;
}

#cart-empty {
  text-align: center;
  color: #999;
  font-style: italic;
  margin: 20px 0;
}

/* PHONE */
@media (max-width: 768px) {
  .menu-grid {
    grid-template-columns: 1fr;
  }
}
</style>
</head>

<body>

<video autoplay muted loop playsinline aria-hidden="true">
  <source src="back.mp4" type="video/mp4">
</video>

<div class="container">
  <div class="header-wrapper">
      <h1>🌸 OSAKA cafe</h1>
  </div>
  

  <!-- MENU -->
  <div class="menu-grid">

    <div class="menu-item">
      <img src="iced_matcha.png">
      <h3>Matcha Latte</h3>
      <p>$1.75</p>
      <button onclick="addToCart('Matcha Latte', 1.75)">Add to Order</button>
    </div>

    <div class="menu-item">
      <img src="https://images.unsplash.com/photo-1558961363-fa8fdf82db35">
      <h3>Cookie Set</h3>
      <p>$1.50</p>
      <button onclick="addToCart('Cookie Set', 5)">Add to Order</button>
    </div>

    <div class="menu-item">
      <img src="iced_latte.png">
      <h3>Iced Latte</h3>
      <p>$1.75</p>
      <button onclick="addToCart('Iced Latte', 1.75)">Add to Order</button>
    </div>

    <div class="menu-item">
      <img src="cappuccino.png">
      <h3>Cappuccino</h3>
      <p>$1.50</p>
      <button onclick="addToCart('Cappuccino', 3)">Add to Order</button>
    </div>

    <div class="menu-item">
      <img src="iced_americano.png">
      <h3>Iced Americano</h3>
      <p>$1.50</p>
      <button onclick="addToCart('Iced Americano', 1.50)">Add to Order</button>
    </div>

    <div class="menu-item">
      <img src="croissant.png">
      <h3>Croissant</h3>
      <p>$1.00</p>
      <button onclick="addToCart('Croissant', 1)">Add to Order</button>
    </div>

  </div>

  <!-- CART -->
  <div id="cart">
    <h2>🛒 Your Order (<span id="cart-count">0</span>)</h2>
    <div id="cart-items"></div>
    <div id="cart-empty">Your cart is empty.</div>
    <div id="cart-total">Total: $0.00</div>
    <button id="send-order" onclick="sendOrder()">📤 Send Order to Kitchen</button>
  </div>
</div>

<script>
let cart = [];

const cartItemsDiv = document.getElementById("cart-items");
const cartTotalDiv = document.getElementById("cart-total");
const cartCountSpan = document.getElementById("cart-count");
const sendBtn = document.getElementById("send-order");
const emptyMsg = document.getElementById("cart-empty");

function updateCartDisplay() {
  cartItemsDiv.innerHTML = "";
  let total = 0;
  let itemCount = 0;

  if (cart.length === 0) {
    emptyMsg.style.display = "block";
    sendBtn.style.display = "none";
    cartTotalDiv.textContent = "Total: $0.00";
    cartCountSpan.textContent = "0";
    return;
  }

  emptyMsg.style.display = "none";
  sendBtn.style.display = "block";

  cart.forEach((item, index) => {
    const itemTotal = item.price * item.qty;
    total += itemTotal;
    itemCount += item.qty;

    const div = document.createElement("div");
    div.className = "cart-item";
    div.innerHTML = `
      <div>
        <strong>${item.name}</strong> – $${item.price.toFixed(2)}
      </div>
      <div class="qty">
        <button onclick="changeQty(${index}, -1)">–</button>
        <span>${item.qty}</span>
        <button onclick="changeQty(${index}, 1)">+</button>
        <button class="remove" onclick="removeItem(${index})">×</button>
      </div>
    `;
    cartItemsDiv.appendChild(div);
  });

  cartTotalDiv.textContent = `Total: $${total.toFixed(2)}`;
  cartCountSpan.textContent = itemCount;
}

window.addToCart = function(name, price) {
  const existing = cart.find(item => item.name === name);
  if (existing) {
    existing.qty += 1;
  } else {
    cart.push({ name, price, qty: 1 });
  }
  updateCartDisplay();
};

window.changeQty = function(index, delta) {
  cart[index].qty += delta;
  if (cart[index].qty <= 0) {
    cart.splice(index, 1);
  }
  updateCartDisplay();
};

window.removeItem = function(index) {
  cart.splice(index, 1);
  updateCartDisplay();
};

window.sendOrder = function() {
  if (cart.length === 0) return;

  const botToken = "7762731023:AAE8xPU8h9X8EF0ba0CIeKH8ENUD2A5IkUM";
  const chatId   = "1061162254";

  // Build nice message
  let message = "🌸 *New Order from OSAKA cafe!*\n\n";
  let total = 0;

  cart.forEach(item => {
    const lineTotal = item.price * item.qty;
    total += lineTotal;
    message += `• ${item.name} × ${item.qty} = $${lineTotal.toFixed(2)}\n`;
  });

  message += `\n💰 *Total: $${total.toFixed(2)}*`;

  const url = `https://api.telegram.org/bot${botToken}/sendMessage`;

  fetch(url, {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({
      chat_id: chatId,
      text: message,
      parse_mode: "Markdown"
    })
  })
  .then(response => response.json())
  .then(data => {
    if (data.ok) {
      alert("✅ Order sent! Arigatou gozaimasu!");
      cart = [];               // ← clear cart after success
      updateCartDisplay();
    } else {
      alert("❌ Telegram error: " + (data.description || "Unknown"));
    }
  })
  .catch(err => {
    alert("❌ Failed to send: " + err.message);
    console.error(err);
  });
};

// Initialize
updateCartDisplay();
</script>

</body>
</html>
